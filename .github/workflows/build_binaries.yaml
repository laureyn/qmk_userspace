name: Build QMK firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  quality:
    name: 'Lint and format check'
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - uses: actions/checkout@v4
        with:
          path: qmk_userspace

      - uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          ref: 0.34.8
          path: qmk_firmware

      - name: Configure QMK
        run: |
          qmk config user.qmk_home=$GITHUB_WORKSPACE/qmk_firmware
          qmk config user.overlay_dir=$GITHUB_WORKSPACE/qmk_userspace

      - name: qmk lint
        run: qmk lint -kb splitkb/aurora/lily58/rev1 -km laureyn --strict

      - name: clang-format check
        working-directory: qmk_userspace
        run: |
          clang-format --dry-run --Werror \
            keyboards/splitkb/aurora/lily58/rev1/keymaps/laureyn/keymap.c \
            keyboards/splitkb/aurora/lily58/rev1/keymaps/laureyn/keymap.h
  build:
    name: 'QMK Userspace Build'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: qmk/qmk_firmware
      qmk_ref: 0.34.8
    needs: quality

  publish:
    name: 'QMK Userspace Publish'
    uses: qmk/.github/.github/workflows/qmk_userspace_publish.yml@main
    if: always() && !cancelled()
    needs: build

  keymap-pictures:
    name: 'Keymap pictures'
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: qmk_userspace

      - uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          ref: 0.34.8
          path: qmk_firmware

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install qmk keymap-drawer

      - name: Draw keymap
        working-directory: qmk_userspace
        env:
          QMK_HOME: ${{ github.workspace }}/qmk_firmware
        run: scripts/generate-keymap.sh

      - name: Commit and attach picture
        working-directory: qmk_userspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/keymap.svg
          git diff --cached --quiet || git commit -m "Update keymap picture [skip ci]"
          git push
          TAG="$(gh release view --json tagName -q .tagName)"
          gh release upload "$TAG" docs/keymap.svg --clobber
